# K3s docs: https://docs.k3s.io/
# Run playbook: ansible-playbook -i inventory.yaml k3s/custom-traefik-config.yaml

- name: Customize traefik config
  gather_facts: false
  hosts: k3s
  vars:
    # --- TRAEFIK OPTIONS ---
    k3s_traefik_replicas: 2               # [Optional] Amount of traefik replicas which should be deployed. Defaults to 2.
    #k3s_traefik_host: traefik.k3s.local  # [Optional] Hostname through which the traefik dashboard should be accessable. Disabled by default/if not declared.
    #k3s_traefik_entrypoints:             # [Optional] Over which traefik entrypoints the traefik dashboard should be exposed. Required when k3s_traefik_host is defined.
    #  - web
    traefik_enable_gateway_api: true      # [Optional] Defines if traefik should allow the usage of the Kubernetes Gateway API. Defaults to false. Docs: https://doc.traefik.io/traefik/getting-started/kubernetes/#exposing-the-application-using-an-ingressroute-crd

    # --- DASHBOARD BASIC AUTH ---
    # Both strings have to be base64-encoded. Command to encode (macOS/Linux): echo -n 'secret' | base64
    # Traefik docs: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/basicauth/
    #traefik_basicauth_username:          # [Optional] Username as base64-encoded-string used to authenticate to the Traefik Dashboard via HTTP Basic Auth. Recommended when exposing the Traefik Dashboard.
    #traefik_basicauth_password:          # [Optional] Password as base64-encoded-string used to authenticate to the Traefik Dashboard via HTTP Basic Auth. Required when traefik_basicauth_username is defined.

    # --- NODE SPECIFIC OPTIONS (should be defined in inventory) ---
    #k3s_master_node: false               # [Optional] Task will only be run on the master node. Should only be defined one node.

  tasks:
    - name: Create custom traefik config
      ansible.builtin.template:
        dest: /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
        src: ./manifests/traefik-config.yaml.j2
      become: true
      when: k3s_master_node | default(false)

    - name: Create basic auth middleware for traefik dashboard
      ansible.builtin.template:
        dest: /var/lib/rancher/k3s/server/manifests/traefik-dashboard-auth.yaml
        src: ./manifests/traefik-dashboard-auth.yaml.j2
      become: true
      when:
        - k3s_master_node | default(false)
        - k3s_traefik_host | default(false)
        - traefik_basicauth_username | default(false)
        - traefik_basicauth_password | default(false)

    - name: Create IngressRoute for traefik dashboard
      ansible.builtin.template:
        dest: /var/lib/rancher/k3s/server/manifests/traefik-ingress.yaml
        src: ./manifests/traefik-ingress.yaml.j2
      become: true
      when:
        - k3s_master_node | default(false)
        - k3s_traefik_host | default(false)
        - k3s_traefik_entrypoints | default(false)