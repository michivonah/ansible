# Longhorn docs: https://longhorn.io/docs/1.12.1/deploy/install/
# Run playbook: ansible-playbook -i inventory.yaml k3s/longhorn-setup.yaml

- name: Setup longhorn for K3s # for using the V1 Data Engine
  gather_facts: true
  hosts: k3s
  vars:
    arch_map:
      x86_64: "amd64"
      aarch64: "arm64"

    packages:
      Debian:
        - nfs-common
        - mawk
        - open-iscsi # https://longhorn.io/docs/1.12.1/advanced-resources/os-distro-specific/csi-on-k3s/
        - dmsetup
      RedHat:
        - nfs-utils
        - gawk
        - iscsi-initiator-utils # https://longhorn.io/kb/troubleshooting-open-iscsi-on-rhel/
        - device-mapper

    # --- LONGHORN OPTIONS ---
    longhorn_version: 1.12.1                              # [Required] Which version of longhorn should be installed; see https://github.com/longhorn/longhorn/releases
    #longhorn_cli_version: 1.12.1                         # [Optional] Which version of longhornctl should be installed. If not defined, longhornctl will not be installed.
    #longhorn_frontend_host: longhorn.k3s.local           # [Optional] The hostname through which the longhorn frontend should be accessible. If not set, longhorn is accessible only internally via the ClusterIP.
    longhorn_settings:                                    # [Optional] Custom settings for longhorn; options: https://longhorn.io/docs/1.12.1/advanced-resources/deploy/customizing-default-settings/
      - name: "allow-collecting-longhorn-usage-metrics"
        value: "false"

      - name: "node-down-pod-deletion-policy"
        value: "delete-both-statefulset-and-deployment-pod"

    # --- LONGHORN BACKUP OPTIONS ---
    # longhorn_backup_target: nfs://<SERVER>:<PATH>       # [Optional] The default target for backups in longhorn. Will be named "default" after creation. Can be a NFS, SMB, CIFS or S3 path.
    # longhorn_backup_tasks:                              # [Optional] Definition of recurring backup tasks in longhorn. See possible options in the official longhorn docs: https://longhorn.io/docs/1.12.1/snapshots-and-backups/scheduling-backups-and-snapshots/
    #   - name: daily-backup
    #     cron: "0 0 * * *"
    #     type: backup
    #     groups:
    #       - default
    #     retain: 7
    #     concurrency: 2

    # --- KUBECTL OPTIONS ---
    #kubeconfig_location: /etc/rancher/k3s/k3s.yaml       # [Optional] Location where the kubeconfig for kubectl is stored. Defaults to /etc/rancher/k3s/k3s.yaml
    #kubectl_bin_location: /usr/local/bin/kubectl         # [Optional] Location where the kubectl binary is located on the node. Defaults to /usr/local/bin/kubectl

    # --- NODE SPECIFIC OPTIONS (should be defined in inventory) ---
    #k3s_node_type: server                                # [Required] Role of the node: 'server' or 'agent'; at least one server node is required to deploy longhorn

  tasks:
    # STEP 1 - PREPARE NODES FOR LONGHORN
    - name: Install general requirements
      ansible.builtin.package:
        name:
          - bash
          - curl
          - grep
          - util-linux # replaces findmnt, blkid, lsblk
          - cryptsetup # for volume encryption using LUKS2; https://longhorn.io/docs/1.12.1/deploy/install/#install-cryptsetup-and-luks
        state: "present"
      become: true

    - name: Install os-specific requirements
      ansible.builtin.package:
        name: "{{ packages[ansible_os_family] }}"
        state: "present"
      become: true

    - name: Check if initiatorname.iscsi exists
      ansible.builtin.stat:
        path: "/etc/iscsi/initiatorname.iscsi"
      become: true
      register: initiatorname_iscsi_existence

    - name: Configure iscsi initiator name # as seen here: https://longhorn.io/docs/1.12.1/deploy/install/#install-open-iscsi
      ansible.builtin.command:
        cmd: 'echo "InitiatorName=$(/sbin/iscsi-iname)" > /etc/iscsi/initiatorname.iscsi'
      become: true
      when: not initiatorname_iscsi_existence.stat.exists

    # Requirement: ansible-galaxy collection install community.general
    - name: Ensure required kernel modules are loaded
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      become: true
      loop:
        - iscsi_tcp
        - nfs
        - dm_crypt

    - name: Start iscsid
      ansible.builtin.systemd_service:
        enabled: true
        name: iscsid
        state: started
      become: true

    - name: Install longhornctl (CLI)
      ansible.builtin.get_url:
        dest: /usr/local/bin/longhornctl
        mode: "+x"
        url: "https://github.com/longhorn/cli/releases/download/v{{ longhorn_cli_version }}/longhornctl-linux-{{ arch_map[ansible_architecture] | default(ansible_architecture) }}"
      become: true
      when:
        - k3s_master_node | default(false)
        - longhorn_cli_version | default(false)

    # STEP 2 - DEPLOY LONGHORN TO CLUSTER
    - name: Deploy longhorn via master node
      block:
        # - name: Install epel on RHEL # required to install python3-kubernetes on RHEL
        #   ansible.builtin.dnf:
        #     name: "epel-release"
        #     state: present
        #   become: true
        #   when: ansible_os_family == 'RedHat'

        # - name: Install python3-kubernetes # dependency for kubernetes.core.k8s
        #   ansible.builtin.package:
        #     name:
        #       - python3-kubernetes
        #     state: "present"
        #   become: true

        - name: Download longhorn YAML manifest
          ansible.builtin.get_url:
            dest: "/var/lib/rancher/k3s/server/manifests/longhorn.yaml" # Auto-Deployment: https://docs.k3s.io/installation/packaged-components
            group: "root"
            mode: "700" #644
            owner: "root"
            url: "https://raw.githubusercontent.com/longhorn/longhorn/v{{ longhorn_version }}/deploy/longhorn.yaml"
          become: true

        - name: Deploy traefik IngressRoute for longhorn frontend
          ansible.builtin.template:
            dest: /var/lib/rancher/k3s/server/manifests/longhorn-ingress.yaml
            src: ./manifests/longhorn-ingress.yaml.j2
          become: true
          when: longhorn_frontend_host is defined

        # Requirement: ansible-galaxy collection install kubernetes.core
        # - name: Install longhorn via kubectl
        #   kubernetes.core.k8s:
        #     kubeconfig: "{{ kubeconfig_location | default('/etc/rancher/k3s/k3s.yaml') }}"
        #     src: "~/longhorn.yaml"
        #     state: present
        #   become: true
      run_once: true # Run this block only on one node
      when: k3s_node_type == 'server' | default(false) # Deployment has to be done on a server node

    - name: Get longhorn settings API version
      ansible.builtin.command:
        cmd: "{{ kubectl_bin_location | default('/usr/local/bin/kubectl') }} get settings.longhorn.io {{ longhorn_settings[0].name }} -n longhorn-system -o jsonpath='{.apiVersion}'"
      become: true
      register: longhorn_api_version
      changed_when: false

    # STEP 3 - CONFIGURE LONGHORN
    - name: Confgure custom longhorn settings
      block:
        # Requirement: ansible-galaxy collection install kubernetes.core
        - name: Configure longhorn settings
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig_location | default('/etc/rancher/k3s/k3s.yaml') }}"
            merge_type: "merge"
            resource_definition:
              apiVersion: "{{ longhorn_api_version.stdout | default('longhorn.io/v1beta2') }}"
              kind: Setting
              metadata:
                name: "{{ item.name }}"
                namespace: longhorn-system
              value: "{{ item.value }}"
            state: present
          become: true
          loop: "{{ longhorn_settings }}" # dict2items

      run_once: true # Run this block only on one node
      when:
        - k3s_node_type == 'server' | default(false) # Has to be run on a server node
        - longhorn_settings is defined # Only run this block, when custom settings are defined

    # STEP 4 - CONFIGURE BACKUPS
    - name: Configure longhorn backup options
      block:
        - name: Define default backup target
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig_location | default('/etc/rancher/k3s/k3s.yaml') }}"
            resource_definition:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: longhorn-default-resource
                namespace: longhorn-system
              data:
                default-resource.yaml: |
                  "backup-target": "{{ longhorn_backup_target }}"
            state: present
          become: true
          when:
            - longhorn_backup_target is defined

        # Docs: https://longhorn.io/docs/1.12.1/snapshots-and-backups/scheduling-backups-and-snapshots/
        - name: Configure backup jobs/task schedule
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig_location | default('/etc/rancher/k3s/k3s.yaml') }}"
            resource_definition:
              apiVersion: "{{ longhorn_api_version.stdout | default('longhorn.io/v1beta2') }}"
              kind: RecurringJob
              metadata:
                name: "{{ item.name }}"
                namespace: longhorn-system
              spec:
                cron: "{{ item.cron }}"
                task: "{{ item.type }}"
                groups: "{{ item.groups }}"
                retain: "{{ item.retain | int }}" # requires ansible-core 2.20.3 to work: https://stackoverflow.com/questions/69109062/cant-set-ansible-fact-as-integer
                concurrency: "{{ item.concurrency | int }}" # requires ansible-core 2.20.3 to work: https://stackoverflow.com/questions/69109062/cant-set-ansible-fact-as-integer
            state: present
          become: true
          loop: "{{ longhorn_backup_tasks }}"
          when:
            - longhorn_backup_tasks is defined

      run_once: true # Run this block only on one node
      when:
        - k3s_node_type == 'server' | default(false) # Has to be run on a server node