log:
  level: info
  job_level: info

runner:
  file: .runner
  capacity: 1
  timeout: 3h
  shutdown_timeout: 3h
  insecure: false
  fetch_timeout: 5s
  report_interval: 1s
  labels:
    - docker
    - debian:docker://docker.io/library/node:lts
    - ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-latest
  
  envs:
    DOCKER_HOST: tcp://docker-dind:2375

container:
  enable_ipv6: false
  privileged: false
  docker_host: "tcp://docker-dind:2375"
  force_pull: false
  force_rebuild: false

server:
  connections:
    forgejo:
      url: {{ forgejo.url }}
      uuid: {{ forgejo.uuid }}
      token: {{ forgejo.token }}